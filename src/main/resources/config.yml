currency:
  name: "金币"
  singular: "金币"
  plural: "金币"
  symbol: "⛃"

# Used only for a new economy ledger. Changing this later never creates more money.
bootstrap:
  treasury-initial-balance: "1000000.00"
  # Paid once per player from Treasury; it is not newly issued currency.
  player-initial-balance: "100.00"

# The state-owned bank uses existing Treasury money as capital. This transfer happens once.
bank:
  initial-capital: "250000.00"
  deposit-rate-bps: 100
  loan-rate-bps: 320
  reserve-ratio-bps: 2000
  maximum-loan: "10000.00"
  lending-enabled: true
  loan-term-days: 7

storage:
  # Production authority. Use sqlite only for local development/imports.
  type: mysql
  mysql:
    jdbc-url: "jdbc:mysql://127.0.0.1:3306/bloeco?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8"
    username: "bloeco"
    # Prefer an environment variable over putting credentials in this file.
    password-env: "BLOECO_MYSQL_PASSWORD"
    password: ""
    maximum-pool-size: 16
  sqlite:
    file: economy.db

# Redis is a rebuildable cache and event transport. It is never the source of truth.
redis:
  enabled: true
  uri: "redis://127.0.0.1:6379/0"
  key-prefix: "bloeco:v2:"
  stream: "bloeco:v2:ledger-events"
  cache-ttl-seconds: 60

integrity:
  check-interval-minutes: 15
