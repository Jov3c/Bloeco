name: CentralEconomy
version: 1.0.0-SNAPSHOT
main: com.blocke.centraleconomy.CentralEconomyPlugin
api-version: '1.21'
softdepend: [Vault]
loadbefore: [BlockStock]
commands:
  economy:
    description: Opens treasury procurement and economy commands.
    usage: /economy [balance [player]|report|treasury <issue|burn> <amount> <memo>|reserve <status|fund <amount> <memo>>]
  pay:
    description: Pays an online player through CentralEconomy.
    usage: /pay <online-player> <amount>
  market:
    description: Opens the player commodity market.
    usage: /market [sell <price>|mine]
permissions:
  centraleconomy.admin:
    description: Allows administration of the CentralEconomy treasury and configuration.
    default: op
