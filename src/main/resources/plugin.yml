name: Bloeco
version: 1.0.0-SNAPSHOT
main: com.blocke.centraleconomy.CentralEconomyPlugin
api-version: '1.21'
softdepend: [Vault]
loadbefore: [Bloeco-Stock, BlockStock]
commands:
  bloeco:
    description: Opens the Bloeco economy centre.
    aliases: [economy]
  pay:
    description: Legacy quick payment command. Bloeco GUI is recommended.
    usage: /pay <online-player> <amount>
  market:
    description: Opens the player commodity market.
    usage: /market [sell <price>|mine]
permissions:
  bloeco.tax-admin:
    description: Allows Bloeco tax and treasury administration unless overridden in config.
    default: op
